[package]
name = "financ"
version = "0.4.0"
license = "MIT OR Apache-2.0"
authors = ["Zsombor Gegesy <gzsombor@gmail.com>"]
repository = "https://github.com/gzsombor/financ"
homepage = "https://github.com/gzsombor/financ"
edition = "2024"

description = "Tool to inspect and modify GnuCash files, and correlate with external sources"

[dependencies]
diesel = { version = "2.3", features = ["sqlite"] }
dotenv = "0.15"
clap = { version = "4.6", features = ["derive"] }
clap_complete = { version = "4.6" }
chrono = { version = "0.4.45", features = ["serde"] }
calamine = { version = "0.36", features = ["chrono"] }
regex = "1"
lazy_static = "1.5.0"
console = "0.16"
guid-create = "0.5"
anyhow = "1.0"
rust_decimal = "1.42"
rhai = "1.25"
serde = { version = "1.0", features = ["derive"] }
scopeguard = "1.2.0"


#[patch.crates-io]
#calamine = { path = "../calamine" }
